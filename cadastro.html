<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100e0c">
  <meta name="description" content="Crie sua conta no QueroEstudar.">
  <title>Cadastro · QueroEstudar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="login-card auth-card" aria-labelledby="signup-title">
      <a class="brand" href="index.html" aria-label="Voltar ao login do QueroEstudar">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/icons/logo.svg" alt="">
        </span>
        <span>QueroEstudar</span>
      </a>

      <header class="login-heading">
        <h2 id="signup-title">Crie sua conta</h2>
        <p>Comece a organizar sua rotina acadêmica.</p>
      </header>

      <form>
        <div class="field">
          <label for="full-name">Nome completo</label>
          <input class="plain-input" id="full-name" name="name" type="text" placeholder="Seu nome completo" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input class="plain-input" id="email" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input class="plain-input" id="password" name="password" type="password" placeholder="Crie uma senha" autocomplete="new-password" required>
        </div>

        <div class="field">
          <label for="confirm-password">Confirmar senha</label>
          <input class="plain-input" id="confirm-password" name="confirm-password" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" required>
        </div>

        <button class="submit-button" type="button">Cadastrar</button>
      </form>

      <p class="signup">Já tem uma conta?<a class="text-link" href="index.html">Entrar</a></p>
    </section>
  </main>
</body>
</html>
